services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  visualization:
    build:
      context: .
      dockerfile: event-detector/Dockerfile
    command: python -m services.visualization --host 0.0.0.0
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: iobt_db
      MONGODB_COLLECTION: event_history
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  registry:
    build:
      context: .
      dockerfile: event-detector/Dockerfile
    command: python -m services.registry
    environment:
      MQTT_HOST: mqtt
      REGISTRY_DB: /data/registry.db
      CE_VISUALIZATION_URL: http://visualization:5000
    volumes:
      - registry-data:/data
    depends_on: [mqtt, visualization]
    restart: unless-stopped

  detector:
    build:
      context: .
      dockerfile: event-detector/Dockerfile
    command:
      - python
      - -u
      - -m
      - runtime.detector
      - /app/ce_definitions/${CE_DEFINITION:-iobt_ce3}.yaml
      - --session
      - ${CE_SESSION:-default}
    environment:
      MQTT_HOST: mqtt
      CE_VISUALIZATION_URL: http://visualization:5000
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: iobt_db
      MONGODB_COLLECTION: event_history
    depends_on:
      - mqtt
      - visualization
    restart: unless-stopped

  replay:
    profiles: [tools]
    build:
      context: .
      dockerfile: event-detector/Dockerfile
    command:
      - python
      - -m
      - runtime.replay
      - /recording
    environment:
      MQTT_HOST: mqtt
    volumes:
      - ${RECORDING_DIR:-.}:/recording:ro
    depends_on:
      - mqtt

volumes:
  registry-data:
  mongodb-data:
